name: Build and Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: dist/app.exe
            asset: app-windows.exe
          - os: ubuntu-latest
            artifact: dist/app
            asset: app-linux
          - os: macos-latest
            artifact: dist/app
            asset: app-macos

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --onefile --noconsole --name app --icon assets/snek.ico main.py

      - name: Rename artifact
        shell: bash
        run: mv "${{ matrix.artifact }}" "dist/${{ matrix.asset }}"

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "dist/${{ matrix.asset }}" --clobber