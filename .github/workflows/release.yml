name: Build and Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            sep: ";"
            built: dist/main.exe
            asset: snek-clicker-win.exe
            flags: --noconsole
            pip_flags: --no-binary pyinstaller
          - os: ubuntu-latest
            sep: ":"
            built: dist/main
            asset: snek-clicker-linux
            flags: --noconsole
            pip_flags: ""
          - os: macos-latest
            sep: ":"
            built: dist/main
            asset: snek-clicker-macos
            flags: --windowed
            pip_flags: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pygame pillow
          pip install ${{ matrix.pip_flags }} pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller --onefile --noupx ${{ matrix.flags }} \
            --icon=assets/snek.ico \
            --add-data "assets${{ matrix.sep }}assets" \
            main.py
          cp "${{ matrix.built }}" "${{ matrix.asset }}"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          overwrite_files: true